name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # A tag must never publish from a red repo: run the same checks
      # CI runs before goreleaser gets to build anything.
      - name: Test
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8 # keep in sync with Makefile tools target

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and upload skill bundle
        run: |
          zip -r ccx.skill skills/ccx/
          gh release upload ${{ github.ref_name }} ccx.skill --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
