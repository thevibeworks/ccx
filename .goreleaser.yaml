version: 2
project_name: ccx

release:
  prerelease: auto
  name_template: "v{{.Version}}"
  draft: false
  mode: "keep-existing"

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - <<: &build_defaults
      binary: ccx
      main: ./cmd/ccx
      ldflags:
        - -s -w
        - -X main.version={{.Version}}
        - -X main.buildTime={{.Date}}
      env:
        - CGO_ENABLED=0
    id: macos
    goos: [darwin]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: nix
    ids: [macos, linux]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{- if eq .Os "darwin" }}macOS{{- else }}{{ .Os }}{{- end }}_{{- if eq .Arch "amd64" }}x86_64{{- else }}{{ .Arch }}{{- end }}
    wrap_in_directory: true
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^ci:'
      - '^test:'
      - Merge pull request
      - Merge branch
